<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/festa-luiza/">
  <title>Claudio Code</title>
  <style>
    :root{
      --ink:#17111d;
      --cream:#fff9f2;
      --rose:#f06292;
      --gold:#f5c842;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:2rem;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--cream);
      background:
        radial-gradient(circle at 20% 15%,rgba(245,200,66,.22),transparent 16rem),
        radial-gradient(circle at 80% 20%,rgba(240,98,146,.22),transparent 16rem),
        linear-gradient(135deg,#0c0711,#24132d);
    }
    main{
      max-width:34rem;
      text-align:center;
      padding:2rem;
      border-radius:24px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 24px 70px rgba(0,0,0,.32);
    }
    h1{margin:0 0 .7rem;font-size:clamp(2rem,8vw,3.2rem);line-height:1}
    p{margin:.4rem 0 1.25rem;color:rgba(255,255,255,.78);line-height:1.6}
    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:.85rem 1.2rem;
      border-radius:999px;
      background:linear-gradient(135deg,var(--gold),var(--rose));
      color:var(--ink);
      font-weight:900;
      text-decoration:none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Claudio Code</h1>
    <p>Redirecionando para o Mundo Encantado da Luiza.</p>
    <a href="/festa-luiza/">Abrir festa da Luiza</a>
  </main>
</body>
</html>
